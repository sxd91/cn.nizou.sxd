[versions]
agp = "9.3.1"
libxposed = "102.0.0"
kotlin = "2.4.10"
# Compose —— wekit 同款（miuix-blur 0.9.4-rc01 要求 compileSdk 37 / Compose 1.12 / lifecycle 2.11 / AGP 9.1+）
compose-bom = "2026.08.00"
compose-material3 = "1.5.0-alpha26"
activity = "1.13.0"
androidx-core-ktx = "1.19.0"
lifecycle-runtime = "2.11.0"
# miuix —— LiquidGlass 悬浮底栏（照抄 wekit，wekit 同款 0.9.4-rc01）
miuix = "0.9.4-rc01"
# MaterialSymbols 图标（wekit 同款 composablehorizons）
composablehorizons-symbols = "2.2.1"
# material-kolor —— 动态配色（wekit 同款 5.0.0）
materialkolor = "5.0.0"
# kotlinx-serialization —— miuix-nav rememberNavBackStack saver 需要 @Serializable 路由（wekit 同款 1.11.0）
serialization = "1.11.0"
# DexKit —— 版本适配：按方法参数类型/字符串引用在 dex 中定位混淆类与方法（高手方案，多版本 hook 兜底）
dexkit = "2.0.6"

[libraries]
libxposed-api = { module = "io.github.libxposed:api", version.ref = "libxposed" }
libxposed-service = { module = "io.github.libxposed:service", version.ref = "libxposed" }
# --- Compose Material3（wekit 同款） ---
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "compose-material3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core-ktx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle-runtime" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
# --- miuix (LiquidGlass 悬浮底栏) ---
miuix-blur = { module = "top.yukonga.miuix.kmp:miuix-blur-android", version.ref = "miuix" }
miuix-shader = { module = "top.yukonga.miuix.kmp:miuix-shader-android", version.ref = "miuix" }
miuix-nav = { module = "top.yukonga.miuix.kmp:miuix-nav-android", version.ref = "miuix" }
# --- MaterialSymbols 图标（wekit 同款） ---
composablehorizons-material-symbols-outlined = { module = "com.composables:icons-material-symbols-outlined-cmp", version.ref = "composablehorizons-symbols" }
composablehorizons-material-symbols-filled = { module = "com.composables:icons-material-symbols-outlined-filled-cmp", version.ref = "composablehorizons-symbols" }
# --- material-kolor（wekit 同款动态配色） ---
materialkolor = { module = "com.materialkolor:material-kolor", version.ref = "materialkolor" }
# --- kotlinx-serialization（@Serializable 路由，miuix-nav saver 用） ---
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
# --- DexKit（版本适配：按传参/字符串引用定位混淆类与方法；2.0 起坐标 org.luckypray） ---
dexkit = { module = "org.luckypray:dexkit", version.ref = "dexkit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
lsplugin-resopt = { id = "org.lsposed.lsplugin.resopt", version = "1.6" }
