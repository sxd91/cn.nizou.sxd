name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "发布为预发行（默认正式发布）"
        type: boolean
        default: false
      publish_lsposed:
        description: "同步推送 LSPosed 镜像仓库（需配置 LSPOSED_PAT secret；未配置则跳过并提示手动步骤）"
        type: boolean
        default: true
  push:
    tags:
      - 'v*'          # tag 触发正式发布（大版本）

permissions:
  contents: write     # 发布 Job 需要写 Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_signed:
    name: Build signed APK
    runs-on: ubuntu-latest
    outputs:
      versionName: ${{ steps.version.outputs.versionName }}
      versionCode: ${{ steps.version.outputs.versionCode }}
      commitSha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # 供 update.json 用 git 版本信息 + changelog

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      # ---- Rust native（笔迹库）：**签名包必须自带**，否则 APK 缺
      #   `lib/arm64-v8a/libauto_oral_strokes.so`，运行时笔迹功能直接失效。
      #   （同 pk-node 「发布包缺 bin/start.js」那类事故，别再犯。）
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Build .so for arm64-v8a
        run: |
          set -euo pipefail
          cargo install cargo-ndk --locked
          NDK_DIR=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/ndk/* 2>/dev/null | sort -V | tail -1)
          test -n "$NDK_DIR" || { echo "ERROR: 未找到 Android NDK"; exit 1; }
          export ANDROID_NDK_HOME="$NDK_DIR"
          echo "NDK=$NDK_DIR"
          (cd rust && cargo test --quiet)
          (cd rust && cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release)
          SO=app/src/main/jniLibs/arm64-v8a/libauto_oral_strokes.so
          test -f "$SO" || { echo "ERROR: 未产出 $SO"; exit 1; }
          # ⚠️ 必须 `-W`：`readelf -d --dyn-syms` 会按终端宽度**截断**长符号名，
          #    导致 grep 误报缺符号（so 其实是好的）。详见 ci.yml 同处注释。
          readelf -Wd --dyn-syms "$SO" | grep -q 'Java_cn_nizou_sxd_util_StrokesKt_getNativeStrokes' \
            || { echo "ERROR: 缺少 JNI 导出符号"; exit 1; }
          echo "OK: libauto_oral_strokes.so 就绪（$(stat -c%s "$SO") bytes）"
      # tag（v1.8.0 → versionName 1.8.0 / code 10800）；
      # workflow_dispatch：当前 version.properties +1 作为本次发布版本（失败则不提交，
      # 见 bump-version job —— 仅发布成功后执行，重试仍构建同一新版本，幂等）。
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          REF="${{ github.ref_name }}"
          if [[ "$REF" == v* ]]; then
            VN="${REF#v}"
            MAJOR=$(echo "$VN" | cut -d. -f1)
            MINOR=$(echo "$VN" | cut -d. -f2)
            PATCH=$(echo "$VN" | cut -d. -f3)
            VC=$((MAJOR*10000 + MINOR*100 + PATCH))
          else
            VC=$(grep -oP '^versionCode=\K\d+' version.properties | head -1)
            VN=$(grep -oP '^versionName=\K.*' version.properties | head -1)
            VC=$((VC + 1))
            VN=$(echo "$VN" | awk -F. '{print $1"."$2"."($3+1)}')
          fi
          echo "versionName=$VN" >> "$GITHUB_OUTPUT"
          echo "versionCode=$VC" >> "$GITHUB_OUTPUT"
          echo "Release version: $VN (code $VC)"

      - name: Record commit
        id: commit
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # ---- 签名：keystore 解码到 RUNNER_TEMP 隔离，密钥走环境变量 ----
      - name: Decode keystore (RUNNER_TEMP isolated)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          # app/build.gradle.kts 读取 ../keystore.jks（仓库根）—— 软链到 RUNNER_TEMP，keystore 本体不入工作区
          ln -sf "$RUNNER_TEMP/keystore.jks" ./keystore.jks

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -PversionCode=${{ steps.version.outputs.versionCode }} -PversionName=${{ steps.version.outputs.versionName }}

      - name: Collect APKs + ABI check + mapping
        run: |
          set -euo pipefail
          mkdir -p dist/apk dist/mapping

          # ★★ 2026-10-01 修正：期望 ABI 从「4 个」改为 **arm64-v8a 一个**。
          #
          # `app/build.gradle.kts` 的 `ndk { abiFilters += listOf("arm64-v8a") }` 只打 arm64
          # （宿主设备就是 arm64）。旧检查却硬要求 4 个 ABI —— 这是**必然误报**，
          # 且会挡住所有 release（同理：笔迹 so 只在 arm64-v8a 下产出）。
          # 如需重新支持多 ABI：改 gradle 的 abiFilters，并把这里同步改回来。
          expected_abis="arm64-v8a"

          for apk in app/build/outputs/apk/release/*.apk; do
            test -f "$apk"

            actual_abis=$(unzip -Z1 "$apk" 'lib/*/*.so' | cut -d/ -f2 | sort -u | tr '\n' ' ' | sed 's/ $//')
            echo "APK: $apk"
            echo "Expected ABIs: $expected_abis"
            echo "Actual ABIs:   ${actual_abis:-<none>}"

            if [ "$actual_abis" != "$expected_abis" ]; then
              echo "::error file=$apk::ABI mismatch. Expected [$expected_abis], got [$actual_abis]"
              exit 1
            fi

            # ★ 门禁：Rust 笔迹 so 必须在签名包里（否则用户装上后笔迹功能直接失效）。
            unzip -Z1 "$apk" | grep -q 'lib/arm64-v8a/libauto_oral_strokes.so' \
              || { echo "::error file=$apk::APK 内缺少 libauto_oral_strokes.so"; exit 1; }

            cp -v "$apk" dist/apk/
          done

          # 收集混淆映射（release 已开 minify）
          find app/build/outputs/mapping -name mapping.txt -exec cp -v {} dist/mapping/ \; || true

          echo "Collected APKs:"; ls -1 dist/apk
          echo "Collected mappings:"; ls -1 dist/mapping || echo "(none)"

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: 老挂戏老叟-signed
          path: dist/apk/*.apk

      - name: Upload obfuscation mapping
        uses: actions/upload-artifact@v4
        with:
          name: obfuscation-mapping
          path: dist/mapping/*.txt

  release:
    name: Publish Release
    needs: build_signed
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download signed APKs
        uses: actions/download-artifact@v4
        with:
          name: 老挂戏老叟-signed
          path: artifacts

      - name: Download obfuscation mapping
        uses: actions/download-artifact@v4
        with:
          name: obfuscation-mapping
          path: artifacts/mapping
        continue-on-error: true

      # ---- 生成 update.json（供应用内更新器；版本用构建时解析值）----
      - name: Generate update.json
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)
          VERSION_NAME="${{ needs.build_signed.outputs.versionName }}"
          VERSION_CODE="${{ needs.build_signed.outputs.versionCode }}"

          cat > artifacts/update.json <<EOF
          {
            "package": "cn.nizou.sxd",
            "name": "老挂戏老叟",
            "versionName": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "commit": "${GIT_HASH}"
          }
          EOF

          echo "Generated update.json:"; cat artifacts/update.json

      # 合并下载的产物
      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p assets
          cp -v artifacts/*.apk assets/ 2>/dev/null || true
          cp -v artifacts/update.json assets/
          cp -v artifacts/mapping/*.txt assets/ 2>/dev/null || true
          echo "Assets:"; ls -1 assets

      # ---- changelog：上一次发行版（任意类型 release）之后的全部提交（剔除版本自增提交）----
      # 2026-08-30 用户要求：发行版内容 = 上次发行版之后所有 CI 的改动。
      # 发布前 gh release list 第一条即「上一次发行版」的 tag；首次发布则取全部提交。
      - name: Generate changelog (since last release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PREV_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""' 2>/dev/null || true)
          echo "Previous release tag: ${PREV_TAG:-<none>}"
          if [ -n "$PREV_TAG" ]; then
            git log --oneline --no-merges --grep="bump version" --invert-grep "${PREV_TAG}..HEAD" > changelog.md || true
          else
            git log --oneline --no-merges --grep="bump version" --invert-grep > changelog.md || true
          fi
          {
            if [ -n "$PREV_TAG" ]; then
              echo "## 变更（自上次发行版 ${PREV_TAG}）"
            else
              echo "## 变更"
            fi
            echo ""
            cat changelog.md
          } > notes.md
          echo "=== Release notes ==="; cat notes.md

      # ---- tag 触发 → 正式 Release（大版本，名字/内容同规格）----
      - name: Publish (tag release)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 老挂戏老叟 ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: assets/*
          body_path: notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---- 手动发布（workflow_dispatch）：滚动 CI Release，默认**正式**（非预发行，由 inputs.prerelease 控制）----
      - name: Publish (rolling CI release)
        if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VN: ${{ needs.build_signed.outputs.versionName }}
        run: |
          gh release delete CI --yes || true
          gh api -X DELETE repos/${{ github.repository }}/git/refs/tags/CI || true
          # 远端 tag CI 已删，本地 checkout（fetch-depth 0 拉全 tags）残留同名 tag 会让
          # gh release create 报 "tag CI exists locally but has not been pushed"，先本地删掉。
          git tag -d CI 2>/dev/null || true
          PRERELEASE_FLAG=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then PRERELEASE_FLAG="--prerelease"; fi
          gh release create CI \
            --title "老挂戏老叟 v${VN}" \
            $PRERELEASE_FLAG \
            --notes-file notes.md \
            assets/*

  # ---- 版本号提交（2026-08-30 用户要求：仅 release 成功后才改版本号；失败不改）----
  # 依赖 [release] 成功：构建/发布任一步失败 → 本 job 不执行 → version.properties 保持原值，
  # 重试 release 仍构建同一新版本（幂等）。[skip ci] + GITHUB_TOKEN push 不触发新 workflow。
  bump-version:
    name: Bump version
    needs: [build_signed, release]
    if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Commit bumped version
        env:
          NVC: ${{ needs.build_signed.outputs.versionCode }}
          NVN: ${{ needs.build_signed.outputs.versionName }}
        run: |
          set -euo pipefail
          git pull --rebase origin main || true
          sed -i "s/^versionCode=.*/versionCode=${NVC}/" version.properties
          sed -i "s/^versionName=.*/versionName=${NVN}/" version.properties
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "chore: bump version to ${NVN} (code ${NVC}) [skip ci]" || { echo "nothing to commit"; exit 0; }
          git push
          echo "Bumped to ${NVN} (code ${NVC})"

  # ---- LSPosed 镜像同步（workflow_dispatch 手动发布时自动执行；需 LSPOSED_PAT secret，未配置则跳过并提示）----
  lsposed_sync:
    name: Sync LSPosed mirror
    needs: [build_signed, release]
    # 默认同步 LSPosed（input 未传/传 true 都同步；仅显式 false 跳过——GitHub UI 对
    # boolean input 未勾选时传 'false'，之前因条件写 =='true' 导致用户触发时 job 被 skip）
    if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') && inputs.publish_lsposed != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: 老挂戏老叟-signed
          path: lsposed_assets
      - name: Sync mirror + release
        env:
          LSPOSED_PAT: ${{ secrets.LSPOSED_PAT }}
          VC: ${{ needs.build_signed.outputs.versionCode }}
          VN: ${{ needs.build_signed.outputs.versionName }}
        run: |
          set -euo pipefail
          # 用构建时的 commit（bump-version 可能与本 job 并行，checkout 的 HEAD 可能已被推进）
          SHORT="${{ needs.build_signed.outputs.commitSha }}"
          TAG="${VC}-${VN}-${SHORT}"
          if [ -z "$LSPOSED_PAT" ]; then
            echo "::warning::LSPOSED_PAT 未配置，跳过自动同步。"
            echo "::warning::手动步骤（参考 skill 05-skill.md 发布流程）：git push mirror main && git tag $TAG && git push mirror $TAG && gh release create $TAG --repo Xposed-Modules-Repo/cn.nizou.sxd --title \"老挂戏老叟 $VN\" lsposed_assets/*.apk"
            exit 0
          fi
          export GH_TOKEN="$LSPOSED_PAT"
          MIRROR="https://x-access-token:${LSPOSED_PAT}@github.com/Xposed-Modules-Repo/cn.nizou.sxd.git"
          git remote remove mirror 2>/dev/null || true
          git remote add mirror "$MIRROR"
          git push mirror main
          git tag "$TAG"
          git push mirror "$TAG"
          gh release create "$TAG" --repo Xposed-Modules-Repo/cn.nizou.sxd \
            --title "老挂戏老叟 $VN" \
            --notes "老挂戏老叟 $VN (code $VC)：CI 构建产物（commit $SHORT）。LSPosed 官网模块页自动构建。" \
            lsposed_assets/*.apk
          echo "LSPosed mirror synced: tag $TAG, release created."
